version: 2

models:
  - name: stg_incident_reports_injury
    description: 'Injury incident records with youth demographics and injury details resulting from an incident.'
    columns:
      - name: incident_id
        description: 'Unique identifier for the injury record within the incident.'
        tests:
          - not_null

      - name: version_number
        description: 'Version number of the submitted incident report.'

      - name: collection_period
        description: 'PbS data collection period (e.g, Apr 2025 or Oct 2025).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Apr 2025', 'Oct 2025']

      - name: respondent_id
        description: 'Identifier of the facility/respondent that submitted the incident report.'
        tests:
          - not_null
          - relationships:
              to: ref('stg_admin_form')
              field: respondent_id

      - name: created_at
        description: 'Timestamp the injury incident record was created.'

      - name: period_begin
        description: 'Start date of the data collection period.'

      - name: period_end
        description: 'End date of the data collection period.'

      - name: facility_urban_rural
        description: 'Whether the facility is located in an urban or rural area.'
        tests:
          - accepted_values:
              arguments:
                  values: ['Rural', 'Urban', 'Suburban']

      - name: facility_field_avg_name
        description: "The type of facility: either 'Correction' (long-term commitment facility) or 'Detention' (short-term pre-adjudication facility)."

      - name: facility_region
        description: 'Geographic region of the facility.'
        tests:
          - accepted_values:
              arguments:
                values:
                  [
                    'South Region',
                    'Northeast Region',
                    'West Region',
                    'Midwest Region',
                  ]

      - name: row_number
        description: "Row number of the injury entry within the incident, corresponding to 'Add each injury that occurred during the incident to the table below.'"

      - name: occurred_date
        description: '2a. Date incident occurred.'

      - name: occurred_in_living_unit
        description: '4. Did the incident occur in a living unit?'
        tests:
          - accepted_values:
              arguments:
                values: ['Yes', 'No', 0] # the 0 is not supposed to be there? 

      - name: youth_id
        description: 'Youth ID associated with the injury (First choice, Second choice, or Third choice if multiple youths were involved).'

      - name: gender
        description: 'Gender of the youth associated with the injury.'
        tests:
          - accepted_values:
              values: ['Male', 'Female']

      - name: age
        description: 'Age of the youth associated with the injury at time of incident.'

      - name: ethnicity
        description: 'Ethnicity of the youth associated with the injury.'
        tests:
          - accepted_values:
              values:
                - 'White, non-Hispanic'
                - 'Black, non-Hispanic'
                - 'White, Hispanic'
                - 'Black, Hispanic'
                - 'Other, Hispanic'
                - 'American Indian or Alaskan Native'
                - 'Native Hawaiian or Other Pacific Islander'
                - 'Asian'
                - 'Other'

      - name: injured_person
        description: 'Parent Question: Add each injury that occurred during the incident. Indicates who was injured (Staff, Youth, Volunteer, or Visitor).'
        tests:
          - accepted_values:
              values: ['Staff', 'Youth', 'Volunteer', 'Visitor']

      - name: injury_source
        description: 'Parent Question: Add each injury that occurred during the incident. Source or cause of the injury.'
        tests:
          - accepted_values:
              values:
                - 'Accident (horseplay)'
                - 'Accident (recreation)'
                - 'Accident (other)'
                - 'Assaulted by staff'
                - 'Assaulted by youth'
                - 'Sexual assault'
                - 'Fight'
                - 'Initiated assault'
                - 'Self-harm'
                - 'Suicidal behavior'
                - 'Tattooing'
                - 'Chemical restraints'
                - 'Mechanical restraints'
                - 'Peer assisted restraints'
                - 'Physical restraints'
                - 'Restraint bed'
                - 'Restraint chair'
                - 'Other restraint'
                - 'Other'
